<!doctype html><html><body style="margin:0"><div id="r"></div><script type="module">
import React from 'react'; import { createRoot } from 'react-dom/client'; import P from '/src/EmailDiscoveryPortal.tsx';
createRoot(document.getElementById('r')).render(React.createElement(P, { workItem: {} }));
const wait = (ms) => new Promise(r => setTimeout(r, ms));
(async () => {
  for (let i = 0; i < 50 && ![...document.querySelectorAll('tbody tr')].length; i++) await wait(200);
  [...document.querySelectorAll('tbody tr')].find(r => r.textContent.includes('EML-4857'))?.click();
  await wait(300);
  const btn = [...document.querySelectorAll('button')].find(b => b.textContent === 'Open FedEX Consignment');
  document.title = btn ? 'BTN_FOUND' : 'BTN_MISSING';
  btn?.click();
})();
</script></body></html>
